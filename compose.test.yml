name: tg_drop_bot_test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: frog_test
      POSTGRES_USER: frog_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [internal]
    mem_limit: 160m
    cpus: 0.20
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U frog_test -d frog_test"]
      interval: 5s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, 40mb, --maxmemory-policy, noeviction]
    volumes: ["redis_data:/data"]
    networks: [internal]
    mem_limit: 64m
    cpus: 0.10
    restart: unless-stopped
  frog_bot:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: tg-drop-bot-test:0.24.0
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://frog_test:${POSTGRES_PASSWORD}@postgres:5432/frog_test
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [internal, edge]
    mem_limit: 256m
    cpus: 0.35
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped
networks:
  internal:
    internal: true
  edge:
    name: tg_drop_bot_test_edge
volumes:
  postgres_data:
  redis_data:
